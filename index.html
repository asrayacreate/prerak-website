<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prerak CRM — AI Link</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a12; --card: #161622; --border: #2d2d42;
      --accent: #f97316; --text: #f0f0f8; --muted: #9494b0;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Sora', sans-serif; margin: 0; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    .crm-grid { display: grid; grid-template-columns: 1fr 400px; gap: 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .cust-item { border-bottom: 1px solid var(--border); padding: 12px 0; display: flex; justify-content: space-between; align-items: center; }
    .btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }
    .ai-box { background: var(--card); border: 1px solid var(--accent); border-radius: 12px; height: 500px; display: flex; flex-direction: column; }
    #chat { flex: 1; overflow-y: auto; padding: 15px; font-size: 13px; line-height: 1.6; }
    .input-area { padding: 15px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    input { flex: 1; background: #1e1e2e; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 6px; outline: none; }
  </style>
</head>
<body>

<div class="header">
  <h1 style="margin:0; font-size: 22px;">Prerak CRM <span style="color:var(--accent)">Assistant</span></h1>
  <button class="btn" onclick="window.location.href='index.html'" style="background:transparent; border:1px solid var(--border)">Dashboard</button>
</div>

<div class="crm-grid">
  <div class="card">
    <h3 style="margin-top:0">Customer Records</h3>
    <div id="customerList"></div>
  </div>

  <div class="ai-box">
    <div style="background: rgba(249,115,22,0.1); padding: 10px; text-align: center; font-weight: 700; color: var(--accent);">CLAUDE AI POWERED</div>
    <div id="chat"></div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Ask about customers...">
      <button class="btn" onclick="askAI()">Send</button>
    </div>
  </div>
</div>

<script>
// साहुजी, तपाईंको API Key यहाँ हालेको छु
const API_KEY = "sk-ant-api03-Inmp2s_Fmj6c0e9q2WPiSa7YX5M7XVX-SnMjfdnB7UH1ptxX5u75ECrbGRh30r3RJAlzCrc_Yk0gUKvqansjNw-XfBE-AAA";

const customers = [
  { name: "Hari Bahadur", phone: "9841234567", category: "Retail", credit: "Rs. 4,500" },
  { name: "Sita Maya", phone: "9801234567", category: "Wholesale", credit: "Rs. 0" },
  { name: "Purna Construction", phone: "9812345678", category: "Prefab", credit: "Rs. 1,20,000" }
];

function render() {
  document.getElementById('customerList').innerHTML = customers.map(c => `
    <div class="cust-item">
      <div>
        <strong>${c.name}</strong><br>
        <small style="color:var(--muted)">${c.phone} | Credit: ${c.credit}</small>
      </div>
      <button class="btn" onclick="analyze('${c.name}')">Analyze</button>
    </div>
  `).join('');
}

async function askAI(query = null) {
  const input = document.getElementById('userInput');
  const chat = document.getElementById('chat');
  const text = query || input.value;
  if (!text) return;

  chat.innerHTML += `<p style="color:var(--accent)"><strong>You:</strong> ${text}</p>`;
  input.value = '';

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': API_KEY,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'dangerously-allow-browser': 'true'
      },
      body: JSON.stringify({
        model: "claude-3-haiku-20240307",
        max_tokens: 500,
        messages: [{ role: "user", content: `Context: ${JSON.stringify(customers)}. User says: ${text}` }]
      })
    });
    const data = await response.json();
    chat.innerHTML += `<p><strong>AI:</strong> ${data.content[0].text}</p>`;
    chat.scrollTop = chat.scrollHeight;
  } catch (err) {
    chat.innerHTML += `<p style="color:red">Error: AI सँग कुरा गर्न मिलेन। Key वा Internet चेक गर्नुहोला।</p>`;
  }
}

function analyze(name) {
  askAI(`Analyze the risk and provide a follow-up strategy for customer: ${name}`);
}

render();
</script>

</body>
</html>
